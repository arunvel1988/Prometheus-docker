global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nginx'
    metrics_path: /nginx_status
    static_configs:
      - targets: ['nginx:80']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

# Specify where to send alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert.rules"  

