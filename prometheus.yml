global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

# Add the rule_files section to include your alert rules
rule_files:
  - "alert.rules"  # Path to your alert rules file
